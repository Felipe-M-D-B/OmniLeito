spring.application.name=ms-notificacoes
server.port=8096

spring.data.mongodb.uri=${OMNILEITO_MONGO_URI:mongodb://localhost:27018/omnileito_notificacoes}
spring.data.mongodb.auto-index-creation=true

spring.rabbitmq.host=${OMNILEITO_RABBIT_HOST:localhost}
spring.rabbitmq.port=${OMNILEITO_RABBIT_PORT:5672}
spring.rabbitmq.username=${OMNILEITO_RABBIT_USER:guest}
spring.rabbitmq.password=${OMNILEITO_RABBIT_PASSWORD:guest}

omnileito.jwt.segredo=${OMNILEITO_JWT_SEGREDO:omnileito-demo-segredo-32-bytes!!}
springdoc.swagger-ui.path=/swagger-ui.html
