spring.application.name=api-gateway
server.port=8085

omnileito.destino.identidade=${OMNILEITO_IDENTIDADE:http://localhost:8092}
omnileito.destino.ocorrencias=${OMNILEITO_OCORRENCIAS:http://localhost:8093}
omnileito.destino.frota=${OMNILEITO_FROTA:http://localhost:8094}
omnileito.destino.leitos=${OMNILEITO_LEITOS:http://localhost:8095}
omnileito.destino.notificacoes=${OMNILEITO_NOTIFICACOES:http://localhost:8096}
omnileito.jwt.segredo=${OMNILEITO_JWT_SEGREDO:omnileito-demo-segredo-32-bytes!!}

resilience4j.circuitbreaker.instances.leitos.sliding-window-size=4
resilience4j.circuitbreaker.instances.leitos.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.leitos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.leitos.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.leitos.timeout-duration=2s
resilience4j.retry.instances.leitos.max-attempts=3
resilience4j.retry.instances.leitos.wait-duration=200ms

spring.cloud.gateway.server.webflux.httpclient.response-timeout=2s
