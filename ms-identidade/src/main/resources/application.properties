spring.application.name=ms-identidade
server.port=8092

spring.datasource.url=jdbc:mysql://localhost:${OMNILEITO_MYSQL_PORT:3310}/omnileito_identidade?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${OMNILEITO_MYSQL_USER:root}
spring.datasource.password=${OMNILEITO_MYSQL_PASSWORD:root123}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

omnileito.jwt.segredo=${OMNILEITO_JWT_SEGREDO:omnileito-demo-segredo-32-bytes!!}
omnileito.jwt.validade-segundos=28800

springdoc.swagger-ui.path=/swagger-ui.html
