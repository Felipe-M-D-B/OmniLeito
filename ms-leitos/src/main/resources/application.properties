spring.application.name=ms-leitos
server.port=8095

spring.datasource.url=jdbc:mysql://localhost:${OMNILEITO_MYSQL_PORT:3310}/omnileito_leitos?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${OMNILEITO_MYSQL_USER:root}
spring.datasource.password=${OMNILEITO_MYSQL_PASSWORD:root123}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.rabbitmq.host=${OMNILEITO_RABBIT_HOST:localhost}
spring.rabbitmq.port=${OMNILEITO_RABBIT_PORT:5672}
spring.rabbitmq.username=${OMNILEITO_RABBIT_USER:guest}
spring.rabbitmq.password=${OMNILEITO_RABBIT_PASSWORD:guest}

spring.data.redis.host=${OMNILEITO_REDIS_HOST:localhost}
spring.data.redis.port=${OMNILEITO_REDIS_PORT:6379}

omnileito.jwt.segredo=${OMNILEITO_JWT_SEGREDO:omnileito-demo-segredo-32-bytes!!}
omnileito.reserva.expiracao-minutos=2
omnileito.reserva.varredura-ms=15000
omnileito.reserva.resultado=
springdoc.swagger-ui.path=/swagger-ui.html
