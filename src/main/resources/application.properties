spring.application.name=OmniLeito

# Porta em que a aplicação Spring Boot vai rodar
server.port=8084
# Configuração da conexão com o banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/OmniLeito
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Opcional: Mostra os comandos SQL gerados pelo Spring no console (ajuda muito a estudar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Configuração do Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-entity.html
springdoc.swagger-ui.operationsSorter=method