spring.application.name=OmniLeito

# Porta em que a aplicação Spring Boot vai rodar
server.port=8084
# Configuração de Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/omnileito
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Configuração do JPA / Hibernate
# Flyway cuida da DDL, desativei a criação automática do Hibernate pra evitar conflitos
spring.jpa.hibernate.ddl-auto=none

# Opcional: Mostra os comandos SQL gerados pelo Spring no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Configuração do Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-entity.html
springdoc.swagger-ui.operationsSorter=method